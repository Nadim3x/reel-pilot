# fly.toml app configuration file generated for reel-pilot on 2026-09-03T18:30:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'reel-pilot'
primary_region = 'sin'

[build]

[env]
  MALLOC_ARENA_MAX = '2'
  PORT = '8080'
  PYTHONUNBUFFERED = '1'

[[mounts]]
  source = 'bot_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 50
    soft_limit = 30

[[vm]]
  size = 'shared-cpu-1x'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
