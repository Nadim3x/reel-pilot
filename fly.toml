# ReelPilot — Fly.io deployment for the 256MB shared-cpu-1x machine.
app = "reelpilot"
primary_region = "sin"

[build]

[env]
  PORT = "8080"
  PYTHONUNBUFFERED = "1"
  MALLOC_ARENA_MAX = "2"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 30
    hard_limit = 50

[[mounts]]
  source = "bot_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory_mb = 256
